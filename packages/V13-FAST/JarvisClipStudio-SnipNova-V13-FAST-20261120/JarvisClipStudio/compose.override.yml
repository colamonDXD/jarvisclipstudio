services:
  backend:
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - ANALYSIS_MODELS=${ANALYSIS_MODELS}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL}
      - PIXABAY_API_KEY=${PIXABAY_API_KEY}
      - COVERR_API_KEY=${COVERR_API_KEY}
      - HF_TOKEN=${HF_TOKEN}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,video,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
  worker:
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - ANALYSIS_MODELS=${ANALYSIS_MODELS}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL}
      - PIXABAY_API_KEY=${PIXABAY_API_KEY}
      - COVERR_API_KEY=${COVERR_API_KEY}
      - HF_TOKEN=${HF_TOKEN}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,video,utility
      - WORKER_MAX_JOBS=1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      # arq --check imports the full worker app; under a busy render that can
      # take longer than the base 10s and wrongly mark the worker unhealthy.
      test: ["CMD", ".venv/bin/arq", "--check", "src.workers.tasks.WorkerSettings"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 120s
  ai-worker:
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - ANALYSIS_MODELS=${ANALYSIS_MODELS}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL}
      - PIXABAY_API_KEY=${PIXABAY_API_KEY}
      - COVERR_API_KEY=${COVERR_API_KEY}
      - HF_TOKEN=${HF_TOKEN}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,video,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    volumes:
      - ./litellm_config.yaml:/app/config.yaml
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - NVIDIA_API_KEY=${NVIDIA_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - CLOUDFLARE_API_KEY=${CLOUDFLARE_API_KEY}
      - CLOUDFLARE_ACCOUNT_ID=${CLOUDFLARE_ACCOUNT_ID}
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
    healthcheck:
      # The berriai/litellm image ships no curl, so the probe uses the
      # image's own python3 — a curl probe here can never pass (on a live
      # install it failed 40 checks in a row before this was switched).
      # The gateway boots slowly and crash-loops loudly when its master
      # key is missing, so the start period covers a normal boot without
      # hiding a real failure for long.
      test: ["CMD", "python3", "-c", "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
